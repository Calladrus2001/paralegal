name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  provision-host:
    name: Provision Host Infrastructure (Hetzner & DNS)
    runs-on: ubuntu-latest
    outputs:
      server_ip: ${{ steps.tf-output.outputs.server_ipv4 }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (for S3 state backend)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init & Apply (Host)
        working-directory: infra/host
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Export Host Outputs
        id: tf-output
        working-directory: infra/host
        run: |
          SERVER_IP=$(terraform output -raw server_ipv4)
          echo "server_ipv4=$SERVER_IP" >> $GITHUB_OUTPUT

  deploy-app:
    name: Deploy App to Hetzner
    needs: provision-host
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ needs.provision-host.outputs.server_ip }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            rm -rf ~/paralegal && git clone https://github.com/${{ github.repository }} ~/paralegal
            cd ~/paralegal
            if ! command -v bun &> /dev/null || ! command -v docker &> /dev/null || ! command -v pm2 &> /dev/null; then
              chmod +x ./scripts/setup-server.sh
              ./scripts/setup-server.sh
            fi

            chmod +x ./scripts/setup-localstack.sh
            
            CI=true OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} ./scripts/setup-localstack.sh
            
            export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            export AWS_DEFAULT_ENDPOINT="https://aws.paralegal.vishesh-dugar.me"
            
            source ~/.bashrc 2>/dev/null || true
            export PATH="$HOME/.bun/bin:$PATH"
            
            bun install
            bun x --bun vite build
            
            npx pm2 start src/common/run-with-env.ts \
              --name "paralegal-app" \
              --interpreter bun \
              --update-env \
              -- config/local.json src/server/index.ts || \
            npx pm2 restart "paralegal-app" --update-env
            
            npx pm2 save
